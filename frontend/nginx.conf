server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 12m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Safety headers for the website files
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # For the Docker health check
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Everything under /api goes to the SwipeX backend (the /api prefix is removed)
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        # the backend already sends these, so do not send them twice
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
    }

    # Built files have a fingerprint in their name, so browsers may keep them for a year
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Every other address is a page of the app
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}