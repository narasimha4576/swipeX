# SwipeX in production: database, website backend, background worker and web server.
# Use it with:  .\dc.ps1 up -d --build
name: swipex-prod

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: swipex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: swipex
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swipex -d swipex"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    image: swipex-backend
    restart: unless-stopped
    env_file: .env.prod
    environment:
      RUN_SCHEDULER_IN_API: "false"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  worker:
    image: swipex-backend
    restart: unless-stopped
    command: ["python", "worker.py"]
    env_file: .env.prod
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; from app.status import get_status, age_seconds; r = get_status('worker_heartbeat'); sys.exit(0 if r and age_seconds(r[1]) < 180 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  uploads: