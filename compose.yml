services:
  db:
    image: postgres:16
    container_name: swipex-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: swipex
      POSTGRES_PASSWORD: swipex_pass
      POSTGRES_DB: swipex
    ports:
      - "5433:5432"
    volumes:
      - swipex_pgdata:/var/lib/postgresql/data

volumes:
  swipex_pgdata: