name: Database backup

on:
  schedule:
    - cron: "30 21 * * *"
  workflow_dispatch:

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install the PostgreSQL 18 client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-18
      - name: Dump and encrypt
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "$BACKUP_PASSPHRASE" ]; then echo "The BACKUP_PASSPHRASE secret is missing"; exit 1; fi
          URL="${DATABASE_URL/+psycopg/}"
          /usr/lib/postgresql/18/bin/pg_dump "$URL" --format=custom --no-owner --no-privileges --file=swipex.dump
          TABLES=$(/usr/lib/postgresql/18/bin/pg_restore --list swipex.dump | grep -c "TABLE DATA" || true)
          echo "Tables in the dump: $TABLES"
          test "$TABLES" -ge 15
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:BACKUP_PASSPHRASE -in swipex.dump -out swipex-backup.dump.enc
          rm swipex.dump
          ls -l swipex-backup.dump.enc
      - name: Keep the encrypted copy for 7 days
        uses: actions/upload-artifact@v4
        with:
          name: swipex-backup-encrypted
          path: swipex-backup.dump.enc
          retention-days: 7