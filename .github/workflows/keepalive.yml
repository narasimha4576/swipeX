name: Keep alive

on:
  schedule:
    - cron: "*/10 0-18 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the API
        run: curl --fail --silent --show-error --max-time 90 --retry 3 --retry-delay 20 --retry-all-errors https://swipex-jrem.onrender.com/health
      - name: Check the website
        run: curl --fail --silent --show-error --max-time 30 --retry 2 --output /dev/null https://swipex.jobslist.workers.dev/